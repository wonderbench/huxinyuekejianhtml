  window.Courseware={
    modules,
    register(module){if(modules.some(x=>x.id===module.id))throw new Error('Duplicate module '+module.id);modules.push(module);},
    announce(text){const el=document.getElementById('announcement');el.textContent=text;el.hidden=false;clearTimeout(this.noticeTimer);this.noticeTimer=setTimeout(()=>el.hidden=true,3500);},
    boot(){
      if(this.started)return;
      this.started=true;
      modules.sort((a,b)=>a.number-b.number);
      const root=document.getElementById('module-host');
      const nav=document.getElementById('module-nav');
      const picker=document.getElementById('module-select');
      const teacher=document.getElementById('teacher-panel');
      const tipsButton=document.getElementById('tips-button');
      const boardButton=document.getElementById('board-mode-button');
      let boardMode=true;
      try{boardMode=localStorage.getItem('motion-lab-display')!=='desk';}catch(e){}
      function renderDisplayMode(){document.documentElement.setAttribute('data-board-mode',boardMode?'whiteboard':'desk');boardButton.setAttribute('aria-pressed',String(boardMode));}
      renderDisplayMode();
      boardButton.addEventListener('click',()=>{boardMode=!boardMode;renderDisplayMode();document.dispatchEvent(new CustomEvent('courseware:displaychange',{detail:{whiteboard:boardMode}}));try{localStorage.setItem('motion-lab-display',boardMode?'whiteboard':'desk');}catch(e){}window.Courseware.announce(boardMode?'已开启白板大字模式。':'已切换为普通字号。');});
      const instances=new Map();
      let active=null,done=new Set();
      try{const saved=JSON.parse(localStorage.getItem('motion-lab-completed')||'[]');if(Array.isArray(saved))done=new Set(saved.filter(id=>typeof id==='string'));}catch(e){/* Offline/private windows can deny storage. */}
      picker.innerHTML=modules.map(m=>'<option value="'+m.id+'">'+String(m.number).padStart(2,'0')+' · '+m.title+'</option>').join('');
      if(modules.length===1){
        nav.className='single-label';
        nav.innerHTML='<span class="num">'+String(modules[0].number).padStart(2,'0')+'</span><span>'+modules[0].title+' · 独立活动</span>';
        document.getElementById('module-picker').hidden=true;
        document.getElementById('footer-nav').hidden=true;
        document.getElementById('footer-state-note').hidden=true;
      }else{
        nav.innerHTML='<span class="nav-indicator" aria-hidden="true"></span>'+modules.map(m=>'<button type="button" class="nav-card" data-module="'+m.id+'" aria-current="false"><span class="nav-number">'+String(m.number).padStart(2,'0')+'</span><span class="nav-title">'+m.title+'</span><span class="nav-done" aria-hidden="true"></span></button>').join('');
        nav.querySelectorAll('[data-module]').forEach((button,index)=>{
          button.addEventListener('click',()=>switchTo(button.dataset.module));
          button.addEventListener('keydown',event=>{
            const delta=event.key==='ArrowRight'?1:event.key==='ArrowLeft'?-1:0;
            if(!delta&&event.key!=='Home'&&event.key!=='End')return;
            event.preventDefault();
            const next=event.key==='Home'?0:event.key==='End'?modules.length-1:(index+delta+modules.length)%modules.length;
            nav.querySelector('[data-module="'+modules[next].id+'"]').focus();
          });
        });
      }
      function markDone(id){done.add(id);try{localStorage.setItem('motion-lab-completed',JSON.stringify([...done]));}catch(e){}renderNav();}
      function renderNav(){
        nav.querySelectorAll('[data-module]').forEach(button=>{
          const selected=button.dataset.module===active.id;
          const completed=done.has(button.dataset.module);
          button.classList.toggle('active',selected);
          button.setAttribute('aria-current',selected?'page':'false');
          const module=modules.find(m=>m.id===button.dataset.module);
          button.setAttribute('aria-label',module.title+(completed?'，已完成':''));
          button.querySelector('.nav-done').textContent=completed?'✓':'';
        });
        const indicator=nav.querySelector('.nav-indicator');
        if(indicator)indicator.style.transform='translateX('+(modules.indexOf(active)*100)+'%)';
        picker.value=active.id;
        document.getElementById('lesson-progress').textContent=modules.filter(m=>done.has(m.id)).length+' / '+modules.length+' 已完成';
      }
      function pauseCurrent(){if(!active)return;const instance=instances.get(active.id);if(instance&&instance.controller.pause)instance.controller.pause();}
      function switchTo(id,focus=false){
        const module=modules.find(x=>x.id===id)||modules[0];
        if(active&&active.id===module.id)return;
        pauseCurrent();
        active=module;
        root.dataset.module=module.id;
        let instance=instances.get(module.id);
        if(!instance){
          const pane=document.createElement('section');
          pane.className='module-pane';
          pane.setAttribute('aria-labelledby','lesson-title');
          const kit=createKit(()=>markDone(module.id));
          root.replaceChildren(pane);
          const mounted=module.mount(pane,kit)||{};
          const controller=typeof mounted==='function'?{destroy:mounted}:mounted;
          instance={pane,kit,controller};
          instances.set(module.id,instance);
          if(!kit.reducedMotion&&typeof pane.animate==='function')pane.animate([{opacity:.6,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:200,easing:'ease-out'});
        }else root.replaceChildren(instance.pane);
        renderNav();
        const lesson=lessons[module.id];
        document.getElementById('lesson-title').textContent=lesson.heading;
        document.getElementById('lesson-description').textContent=lesson.description;
        document.getElementById('lesson-number').textContent='活动 '+String(module.number).padStart(2,'0');
        teacher.innerHTML='<h2>教学提示 · '+module.title+'</h2><ol>'+lesson.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><p>'+lesson.note+'</p>';
        document.getElementById('current-step').textContent=module.number+' / 5';
        const index=modules.indexOf(module);
        document.getElementById('prev-module').disabled=index===0;
        document.getElementById('next-module').disabled=index===modules.length-1;
        document.title=module.title+' · 平移与旋转互动实验室';
        try{history.replaceState(null,'','#'+module.id);}catch(e){}
        if(focus){const button=nav.querySelector('[data-module="'+module.id+'"]');if(button)button.focus({preventScroll:true});else picker.focus({preventScroll:true});}
      }
      picker.addEventListener('change',()=>switchTo(picker.value));
      tipsButton.addEventListener('click',()=>{teacher.hidden=!teacher.hidden;tipsButton.setAttribute('aria-expanded',String(!teacher.hidden));});
      teacher.addEventListener('keydown',event=>{if(event.key==='Escape'){teacher.hidden=true;tipsButton.setAttribute('aria-expanded','false');tipsButton.focus();}});
      const full=document.getElementById('fullscreen-button');
      full.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else window.Courseware.announce('可使用浏览器菜单进入全屏演示。');}catch(e){window.Courseware.announce('当前窗口不支持全屏，可使用浏览器菜单进入全屏。');}});
      document.addEventListener('fullscreenchange',()=>{full.querySelector('span').textContent=document.fullscreenElement?'退出全屏':'全屏演示';});
      document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseCurrent();});
      document.getElementById('prev-module').addEventListener('click',()=>{const index=modules.indexOf(active);if(index>0)switchTo(modules[index-1].id,true);});
      document.getElementById('next-module').addEventListener('click',()=>{const index=modules.indexOf(active);if(index<modules.length-1)switchTo(modules[index+1].id,true);});
      window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(modules.some(m=>m.id===id))switchTo(id);});
      window.addEventListener('pagehide',event=>{
        if(event.persisted){pauseCurrent();return;}
        for(const instance of instances.values()){if(instance.controller.destroy)instance.controller.destroy();instance.kit.dispose();}
        clearTimeout(window.Courseware.noticeTimer);
      });
      switchTo(location.hash.slice(1));
    }
  };
})();

    const $ = selector => root.querySelector(selector);
    const input = $('.ck-answer-row input'), feedback = $('.ck-feedback');
    const targetMinutes = () => target * 5;
    const predictionChanged = () => prediction !== null && (input.value.trim() === '' || Number(input.value) !== prediction);
    const ready = () => prediction !== null && !predictionChanged();
    function stopAnimation() { if (animation) animation.cancel(); animation = null; playing = false; }
    function pauseActivity() { if (animation) animation.pause(); playing = false; draw(); }
    function focusControl(el) { el.focus({ preventScroll: true }); if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }
    function updateButtons() {
      const canVerify = ready(), needsSubmission = !canVerify;
      $('.ck-play').disabled = !canVerify;
      $('.ck-step').disabled = !canVerify || playing || completed;
      $('.ck-play').textContent = playing ? '暂停转动' : completed ? '重看数格过程' : animation || minutes > 0 ? '继续验证' : '开始验证';
      $('.ck-play').classList.toggle('primary', canVerify && !completed);
      $('.ck-play').classList.toggle('secondary', !canVerify || completed);
      $('.ck-submit').classList.toggle('primary', needsSubmission);
      $('.ck-submit').classList.toggle('secondary', !needsSubmission);
      $('.ck-submit').disabled = !needsSubmission;
      $('.ck-submit').textContent = prediction === null ? '提交预测' : predictionChanged() ? completed ? '检查修改后的答案' : '更新预测' : completed ? '答案已核对' : '预测已提交';
      $('.ck-next').hidden = !completed;
      $('.ck-next').classList.toggle('primary', canVerify);
      $('.ck-next').classList.toggle('secondary', !canVerify);
      $('.ck-play-help').textContent = prediction === null ? '先填写并提交预测，才能开始验证。'
        : predictionChanged() ? '预测有修改，请重新提交后继续验证。'
        : completed ? '已到达目标。可以选下一题，也可以重看数格过程。'
        : playing ? '分针正在顺时针转动，随时可以暂停。'
        : minutes > 0 ? '进度已保留。继续验证或点“走一大格”。'
        : '预测已记录。点“开始验证”，也可以每次走一大格。';
    }
    function draw() {
      const angle = minutes * 6;
      $('.ck-hand').setAttribute('transform', `rotate(${angle} 330 225)`);
      $('.ck-trace').setAttribute('d', showTrace ? arc(angle, 157) : '');
      const end = point(angle, 132);
      $('.ck-sector').setAttribute('d', showTrace && angle > .01 ? `M 330 225 L 330 93 A 132 132 0 ${angle > 180 ? 1 : 0} 1 ${end.x} ${end.y} Z` : '');
      const p = point(target * 30, 116); $('.ck-target').setAttribute('cx', p.x); $('.ck-target').setAttribute('cy', p.y);
      $('.ck-five-labels').setAttribute('visibility', showMinutes ? 'visible' : 'hidden');
      const reveal = showMinutes || completed;
      $('.ck-count').classList.toggle('ck-muted', !reveal); $('.ck-time').classList.toggle('ck-muted', !reveal);
      $('.ck-count').textContent = reveal ? `${Math.floor((minutes + .001) / 5)} 格` : '暂时隐藏';
      $('.ck-time').textContent = reveal ? `${Math.floor(minutes + .001)} 分钟` : '暂时隐藏';
      $('.ck-target-label').textContent = target;
      root.querySelectorAll('[data-number]').forEach(el => { const active = Number(el.dataset.number) === target; el.setAttribute('fill', active ? '#9E6524' : '#46624A'); el.setAttribute('font-weight', active ? '800' : '650'); });
      root.querySelectorAll('[data-target]').forEach(el => { const active = Number(el.dataset.target) === target; el.classList.toggle('active', active); el.setAttribute('aria-pressed', String(active)); });
      updateButtons();
    }
    function showResult() {
      const correct = prediction === targetMinutes();
      kit.feedback(feedback, `${correct ? '预测正确！' : `你预测 ${prediction} 分钟。`} 分针走了 ${target} 个大格，每格 5 分钟，一共 ${targetMinutes()} 分钟。${correct ? '' : '可以修改答案后再检查，或重播数格过程。'}`, correct ? 'success' : 'info');
      if (correct) kit.markDone();
    }
    function finish() {
      completed = true; minutes = targetMinutes(); animation = null; playing = false; seen.add(target);
      $('.ck-record-items').innerHTML = [...seen].sort((a, b) => a - b).map(n => `<span>12 → ${n}：${n * 5} 分钟</span>`).join('');
      showResult(); draw();
    }
    function moveTo(destination) {
      if (prediction === null) return;
      stopAnimation(); playing = true; tweenDestination = destination;
      const duration = (destination - minutes) / 5 * (kit.reducedMotion ? 160 : slow ? 1300 : 700);
      animation = kit.tween(minutes, destination, Math.max(80, duration), value => { minutes = value; draw(); }, () => {
        animation = null; playing = false; minutes = destination;
        if (minutes >= targetMinutes() - .001) finish();
        else { draw(); kit.feedback(feedback, showMinutes ? `现在走了 ${Math.round(minutes / 5)} 个大格，经过 ${Math.round(minutes)} 分钟。继续观察。` : '分针又走完一大格。记住走了几格，继续观察。'); }
      });
      updateButtons();
    }
    function reset(clearPrediction = false) {
      stopAnimation(); minutes = 0; completed = false;
      if (clearPrediction) { prediction = null; input.value = ''; input.setAttribute('aria-invalid', 'false'); }
      kit.feedback(feedback, prediction === null ? '填入预计分钟数，再提交预测。' : `已保留你的预测：${prediction} 分钟。分针回到 12，可以再观察一次。`);
      draw();
    }
    function selectTarget(value) { if (target === value) return; target = value; reset(true); }
    function nextQuestion() {
      const options = Array.from({ length: 11 }, (_, i) => i + 1).filter(n => n !== target);
      selectTarget(options[Math.floor(Math.random() * options.length)]); focusControl(input);
    }
    kit.listen($('.ck-form'), 'submit', event => {
      event.preventDefault();
      const raw = input.value.trim(), value = Number(raw);
      if (!raw || !Number.isInteger(value) || value < 0 || value > 60) { pauseActivity(); input.setAttribute('aria-invalid', 'true'); kit.feedback(feedback, '请填 0 到 60 之间的整数分钟，例如 15，再提交。', 'error'); input.focus(); return; }
      prediction = value;
      input.setAttribute('aria-invalid', 'false');
      if (completed) showResult();
      else kit.feedback(feedback, `预测已记录：${prediction} 分钟。点“${minutes > 0 ? '继续验证' : '开始验证'}”来观察。`);
      updateButtons();
      if (!completed) focusControl($('.ck-play'));
    });
    function onPredictionInput() {
      if (playing) pauseActivity();
      input.setAttribute('aria-invalid', 'false');
      if (predictionChanged()) kit.feedback(feedback, '预测有修改，重新提交后可继续验证。');
      updateButtons();
    }
    kit.listen(input, 'input', onPredictionInput);
    root.querySelectorAll('[data-prediction-step]').forEach(button => {
      kit.listen(button, 'click', () => {
        const value = Number(input.value), base = Number.isFinite(value) ? Math.round(value) : 0;
        const next = Math.max(0, Math.min(60, base + Number(button.dataset.predictionStep)));
        input.value = String(next); onPredictionInput();
        kit.feedback(feedback, `当前预测：${next} 分钟。${prediction === null ? '提交预测后再验证。' : predictionChanged() ? '重新提交后可继续验证。' : '与已提交预测相同，可以继续验证。'}`);
      });
    });
    kit.listen(root, 'click', event => {
      const button = event.target.closest('[data-target]'); if (button && root.contains(button)) selectTarget(Number(button.dataset.target));
    });
    kit.listen($('.ck-random'), 'click', nextQuestion);
    kit.listen($('.ck-next'), 'click', nextQuestion);
    kit.listen($('.ck-play'), 'click', () => {
      if (!ready()) return;
      if (playing) { pauseActivity(); return; }
      if (animation) { animation.resume(); playing = true; updateButtons(); return; }
      if (completed) reset(false);
      moveTo(targetMinutes());
    });
    kit.listen($('.ck-step'), 'click', () => { if (ready() && !playing && !completed) moveTo(Math.min(targetMinutes(), (Math.floor(minutes / 5 + .001) + 1) * 5)); });
    kit.listen($('.ck-reset'), 'click', () => reset(false));
    kit.listen($('.ck-slow'), 'change', event => {
      slow = event.target.checked;
      if (animation) { const wasPlaying = playing; moveTo(tweenDestination); if (!wasPlaying) pauseActivity(); }
    });
    kit.listen($('.ck-show-minutes'), 'change', event => { showMinutes = event.target.checked; draw(); });
    kit.listen($('.ck-show-trace'), 'change', event => { showTrace = event.target.checked; draw(); });
    reset(true);
    return { pause: pauseActivity, destroy: stopAnimation };
  }
});

Courseware.boot();</script>
</body>
</html>
